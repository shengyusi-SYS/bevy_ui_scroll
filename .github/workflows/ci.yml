name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo test --lib
      - run: cargo doc --no-deps
